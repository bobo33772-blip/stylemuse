<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>공지사항 | StyleMuse</title>
    <style>
        /* index.html 과 같은 모바일 우선 기준. 앱 폭 480px. */
        body { margin: 0; background: #000; color: white; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }

        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #0a0a0a; padding-bottom: env(safe-area-inset-bottom); }

        /* 상단: 뒤로가기 + 화면 이름. 검색창은 두지 않는다(확정 결정). */
        header { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px; border-bottom: 1px solid #1c1c1c; position: sticky; top: 0; background: #0a0a0a; }
        .back-link { color: #ddd; text-decoration: none; font-size: 20px; line-height: 1; padding: 4px 6px; }
        .screen-name { font-size: 16px; font-weight: bold; }

        .container { padding: 18px 16px 30px; }

        /* 좁은 화면에서는 표보다 목록이 읽기 쉽다 */
        .notice-item { display: block; padding: 16px 2px; border-bottom: 1px solid #1c1c1c; }
        .notice-title { font-size: 14px; color: #eee; line-height: 1.6; }
        .notice-date { font-size: 12px; color: #666; margin-top: 7px; }

        .badge { background: #2a2a2a; padding: 3px 7px; border-radius: 4px; font-size: 11px; color: #ddd; margin-right: 7px; }
        .badge.notice { background: #fff; color: #000; font-weight: bold; }
    </style>
</head>
<body>

  <div class="app">
    <header>
        <a class="back-link" href="{{ url_for('home') }}" aria-label="뒤로가기">←</a>
        <div class="screen-name">공지사항</div>
    </header>

    <div class="container">
        <div class="notice-item">
            <div class="notice-title">
                <span class="badge notice">공지</span>StyleMuse 여름 시즌 업데이트 안내
            </div>
            <div class="notice-date">2026.06.26</div>
        </div>

        <div class="notice-item">
            <div class="notice-title">
                <span class="badge">업데이트</span>고프코어 스타일 AI 분석 기능 추가
            </div>
            <div class="notice-date">2026.06.20</div>
        </div>
    </div>
  </div>

</body>
</html>
