<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>공지사항 | StyleMuse</title>
    <style>
        /* 공통 스타일 */
        body { background-color: #0a0a0a; color: white; margin: 0; font-family: 'Pretendard', sans-serif; }
        
        /* 헤더 스타일 (index.html과 동일하게) */
        header { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; border-bottom: 1px solid #222; }
        .logo { font-size: 24px; font-weight: bold; cursor: pointer; }
        .search-box { background: #222; border-radius: 20px; padding: 8px 15px; width: 300px; display: flex; align-items: center; color: #888; }
        .search-box svg { margin-right: 10px; flex-shrink: 0; }
        .search-box input { background: none; border: none; color: white; margin-left: 5px; width: 100%; outline: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links span { cursor: pointer; color: #aaa; }

        /* 컨테이너 */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { margin-bottom: 30px; font-size: 28px; }

        /* 테이블 스타일 */
        .notice-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .notice-table th { border-top: 2px solid #fff; border-bottom: 1px solid #333; padding: 15px; text-align: left; font-size: 14px; }
        .notice-table td { border-bottom: 1px solid #222; padding: 20px 15px; font-size: 15px; color: #ccc; }
        .notice-table tr:hover { background: #1a1a1a; cursor: pointer; transition: 0.2s; }

        /* 뱃지 */
        .badge { background: #333; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #fff; margin-right: 10px; }
        .badge.notice { background: #fff; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="{{ url_for('home') }}" style="text-decoration: none; color: white;">StyleMuse</a>
        </div>
        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Search outfit styles">
        </div>
        <div class="nav-links">
            <span>EXPLORE</span><span>SAVED</span><span>OUTFITS</span>
            <a href="{{ url_for('notices') }}" style="text-decoration: none; color: white; cursor: pointer;">🔔</a>
        </div>
    </header>

    <div class="container">
        <h1>공지사항</h1>

        <table class="notice-table">
            <thead>
                <tr>
                    <th style="width: 80px;">번호</th>
                    <th>제목</th>
                    <th style="width: 120px;">날짜</th>
                </tr>
            </thead>
            <tbody>
                <tr onclick="location.href='#'">
                    <td>2</td>
                    <td><span class="badge notice">공지</span> StyleMuse 여름 시즌 업데이트 안내</td>
                    <td>2026.06.26</td>
                </tr>
                <tr onclick="location.href='#'">
                    <td>1</td>
                    <td><span class="badge">업데이트</span> 고프코어 스타일 AI 분석 기능 추가</td>
                    <td>2026.06.20</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
