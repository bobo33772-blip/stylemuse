<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>{% block title %}{% endblock %} | StyleMuse</title>
    <style>
        /* index.html 과 같은 모바일 우선 기준. 앱 폭 480px. */
        body { margin: 0; background: #000; color: white; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
        .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #0a0a0a; padding-bottom: env(safe-area-inset-bottom); }

        header { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px; border-bottom: 1px solid #1c1c1c; position: sticky; top: 0; background: #0a0a0a; z-index: 10; }
        .back-link { color: #ddd; text-decoration: none; font-size: 20px; line-height: 1; padding: 4px 6px; }
        .screen-name { font-size: 16px; font-weight: bold; }

        /* 읽기용 본문 */
        .doc { padding: 22px 18px 40px; }
        .doc-meta { color: #777; font-size: 12px; line-height: 1.8; padding-bottom: 16px; border-bottom: 1px solid #1c1c1c; margin-bottom: 22px; }
        .doc h2 { font-size: 15px; margin: 30px 0 10px; color: #fff; }
        .doc h2:first-of-type { margin-top: 0; }
        .doc h3 { font-size: 13px; margin: 18px 0 8px; color: #ddd; }
        .doc p, .doc li { font-size: 13.5px; line-height: 1.85; color: #c8c8c8; }
        .doc p { margin: 0 0 12px; }
        .doc ul, .doc ol { margin: 0 0 12px; padding-left: 18px; }
        .doc li { margin-bottom: 6px; }
        .doc strong { color: #fff; }

        table { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: 12.5px; }
        th, td { border: 1px solid #262626; padding: 8px 9px; text-align: left; vertical-align: top; line-height: 1.6; }
        th { background: #151515; color: #ddd; font-weight: bold; }
        td { color: #c8c8c8; }

        .callout { background: #141414; border: 1px solid #262626; border-radius: 10px; padding: 14px 15px; margin: 14px 0; }
        .callout p:last-child { margin-bottom: 0; }
        .todo { color: #f59e0b; }
        .doc a { color: #8ab4ff; }
    </style>
</head>
<body>
  <div class="app">
    <header>
        <a class="back-link" href="{{ url_for('home') }}" aria-label="뒤로가기">←</a>
        <div class="screen-name">{% block heading %}{% endblock %}</div>
    </header>
    <div class="doc">
{% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
